[mysqld]
# 设置mysql客户端连接服务端时默认使用的端口port=3306

#远程连接
bind-address = 0.0.0.0

# 设置mysql的安装目录
basedir=D:\mysql-9.3.0-winx64

# 设置mysql数据库的数据的存放目录
datadir=D:\mysql-9.3.0-winx64\Data

# 允许最大连接数
max_connections=200

# 允许连接失败的次数。
max_connect_errors=10

# 服务端使用的字符集默认为utf8mb4
character-set-server=utf8mb4

# 创建新表时将使用的默认存储引擎
default-storage-engine=INNODB

# 默认使用“mysql_native_password”插件认证
#mysql_native_password

wait_timeout=86400
[mysql]
# 设置mysql客户端默认字符集
default-character-set=utf8mb4
[client]




